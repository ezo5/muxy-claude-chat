<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/transcript.css">
<link rel="stylesheet" href="css/markdown.css">
<link rel="stylesheet" href="css/composer.css">

<body>
<header id="topbar" class="topbar">
  <button id="pins-btn" class="hdr-btn" title="Pinned messages"></button>
  <div class="title-block">
    <div id="title" class="title" title="Double-click to rename">Claude</div>
    <div id="subtitle" class="subtitle"></div>
  </div>
  <button id="model-btn" class="chip-btn model-chip hidden" title="Model and effort (click to switch)"></button>
  <button id="start-btn" class="chip-btn primary hidden" title="Start Claude again on this conversation">Start</button>
  <span id="status" class="status"></span>
  <div id="view-seg" class="rv-seg view-seg">
    <button id="chat-btn" type="button" class="active">Chat</button>
    <button id="terminal-btn" type="button">Terminal</button>
  </div>
  <div class="hdr-actions">
    <button id="settings-btn" class="hdr-btn" title="Settings"></button>
  </div>
</header>
<div class="body-row">
<aside id="pins" class="pins hidden"></aside>
<div class="chat-col">
<main id="scroller" class="scroller"></main>
<button id="jump" class="jump hidden" title="Jump to latest"></button>
<footer id="footer" class="footer"></footer>
<section id="review" class="review hidden"></section>
</div>
<aside id="agents" class="agents hidden"></aside>
</div>
